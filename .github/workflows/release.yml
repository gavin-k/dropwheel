name: Release

# 手动触发，或推送 v* 标签。产物：未签名的 x64 + ARM64 .msixbundle（以及单架构 .msix）。
# 签名留给 Store 提交 / 外部签名流程；仓库里不放任何证书。
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  WINAPP_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  package:
    name: MSIX (x64 + arm64, unsigned)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install winapp CLI
        shell: pwsh
        run: |
          $dest = Join-Path $env:RUNNER_TEMP 'winapp'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $zip = Join-Path $env:RUNNER_TEMP 'winappcli-x64.zip'
          Invoke-WebRequest 'https://github.com/microsoft/WinAppCli/releases/latest/download/winappcli-x64.zip' -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          Add-Content $env:GITHUB_PATH $dest
          & (Join-Path $dest 'winapp.exe') --version

      - name: Core tests
        run: |
          dotnet restore tests/DropWheel.Core.Tests/DropWheel.Core.Tests.csproj
          dotnet test tests/DropWheel.Core.Tests/DropWheel.Core.Tests.csproj -c Release --no-restore

      # 单架构 .msix（各自可单独 sideload / 排错）
      - name: Pack x64
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/x64 | Out-Null
          Push-Location artifacts/x64
          winapp pack ../../src/DropWheel.App/DropWheel.App.csproj -c Release --arch x64 --no-sign
          Pop-Location

      - name: Pack arm64
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/arm64 | Out-Null
          Push-Location artifacts/arm64
          winapp pack ../../src/DropWheel.App/DropWheel.App.csproj -c Release --arch arm64 --no-sign
          Pop-Location

      # 多架构 bundle：winapp 对每个 --arch 各 publish 一次并合成 .msixbundle
      - name: Pack msixbundle (x64 + arm64)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/bundle | Out-Null
          Push-Location artifacts/bundle
          winapp pack ../../src/DropWheel.App/DropWheel.App.csproj -c Release --arch x64 --arch arm64 --no-sign
          Pop-Location
          Get-ChildItem -Recurse artifacts -Include *.msix,*.msixbundle | Format-Table Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      - uses: actions/upload-artifact@v4
        with:
          name: DropWheel-msix-${{ github.ref_name }}
          path: |
            artifacts/x64/*.msix
            artifacts/arm64/*.msix
            artifacts/bundle/*.msixbundle
          if-no-files-found: error
